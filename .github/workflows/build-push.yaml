name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

# Don't run two image builds for main at the same time.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create the GitHub release
  packages: write # required, or the image push fails with permission_denied

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "0"')
          next=$((latest + 1))
          echo "Latest release: ${latest:-<none>} -> next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .build/Dockerfile # the Dockerfile isn't at the repo root
          # amd64 only. QSV, intel-media-va-driver-non-free and the whole hardware path are amd64;
          # an arm64 image would silently fall back to software encoding (plan.md 23.3).
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only tag a release once the image has actually been pushed.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
