name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

# Don't run two image builds for main at the same time.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v1
    permissions:
      contents: write # required to create the GitHub release
      packages: write # required, or the image push fails with permission_denied
    with:
      dockerfile: .build/Dockerfile # the Dockerfile isn't at the repo root
      # amd64 only. QSV, intel-media-va-driver-non-free and the whole hardware path are amd64;
      # an arm64 image would silently fall back to software encoding (plan.md 23.3).
      platforms: linux/amd64

  deploy:
    needs: build-push
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v1
    permissions: {} # nothing from THIS repo is needed; DEPLOY_TOKEN carries the rights
    with:
      tag: ${{ needs.build-push.outputs.version }}
      # codarr is a template in the shared media chart rather than a chart of its own, because a PVC
      # cannot be mounted across namespaces and media-library lives in `media`.
      values-path: argo_apps/workloads/charts/media/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
