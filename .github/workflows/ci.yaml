name: ci

# This repo commits straight to main, so the push trigger is the one that actually gates.
# The pull_request trigger is there for the Renovate PRs, whose automerge waits on this check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: yama6a/gha/.github/workflows/go-ci.yaml@v2

  node:
    uses: yama6a/gha/.github/workflows/node-ci.yaml@v2
    with:
      working-directory: web

  renovate-config:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
