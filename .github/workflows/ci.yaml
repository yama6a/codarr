name: ci

# This repo commits straight to main, so the push trigger is the one that actually gates.
# The pull_request trigger is there for the Renovate PRs, whose automerge waits on this check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # fumpt, generate, lint, vet, govulncheck, go test
      - name: make ci
        run: make ci

      # `make ci` runs `make generate`. If that changed anything under api/, the committed generated
      # Go is stale.
      - name: Check generated Go is in sync
        run: |
          git diff --exit-code -- api/ || {
            echo "::error::api/ is out of sync with api/openapi.yaml. Run 'make generate' and commit the result."
            exit 1
          }

      # `make ci` also runs `gofumpt -w .`, which REWRITES rather than reports. Without this the
      # runner silently fixes formatting drift and the branch stays unformatted forever.
      - name: Check formatting is in sync
        run: |
          git diff --exit-code -- '*.go' || {
            echo "::error::Go files are not gofumpt-formatted. Run 'make fumpt' and commit the result."
            exit 1
          }

  web:
    uses: yama6a/gha/.github/workflows/node-ci.yaml@v1
    with:
      working-directory: web
      pre-check: |
        cd web && npm run openapi-ts
        git diff --exit-code -- src/api/ || {
          echo "::error::web/src/api/ is out of sync with api/openapi.yaml. Run 'npm run openapi-ts' in web/ and commit the result."
          exit 1
        }

  renovate-config:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v1
